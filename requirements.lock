# Fully-pinned lockfile generated from requirements.txt to make installs fast and
# reproducible (avoids pip's multi-hour dependency-resolver backtracking).
# Regenerate after editing requirements.txt with:
#   DATA_DIR=$HOME/genesys/data uv pip compile requirements.txt -o requirements.lock \
#     --python-version 3.10 --python-platform x86_64-unknown-linux-gnu \
#     --extra-index-url https://download.pytorch.org/whl/cpu \
#     --index-strategy unsafe-best-match \
#     --constraint constraints.lock.txt --emit-index-url
# constraints.lock.txt pins: torch==2.4.1+cpu, triton==3.0.0 (match the Dockerfile's CPU torch).
--index-url https://pypi.org/simple
--extra-index-url https://download.pytorch.org/whl/cpu

